server:
  port: ${DISCOVERY_SERVER_PORT:8761}

spring:
  application:
    name: DISCOVERY-SERVER
  cloud:
    service-registration:
      auto-registration:
        # This node is the registry itself, never a registered service.
        enabled: false

eureka:
  dashboard:
    # HTML dashboard at http://localhost:8761/ (enabled by default, set here
    # explicitly so the URL is documented config rather than an accident).
    enabled: ${EUREKA_DASHBOARD_ENABLED:true}
    path: ${EUREKA_DASHBOARD_PATH:/}
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # A registry does not register with itself.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Standalone development registry: do not keep stale registrations.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

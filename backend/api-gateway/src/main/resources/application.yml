server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: API-GATEWAY
  # Gateway is WebFlux-only (verified with dependency:tree: no spring-webmvc,
  # no Tomcat). Pin the application type so a future dependency cannot silently
  # switch this reactive app to Spring MVC.
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # The three intended routes are declared explicitly with lb://
              # URIs in GatewayRoutesConfig, resolved through Eureka at request
              # time. Keep the automatic locator off so unrelated services are
              # not exposed before authentication is introduced (later phase).
              enabled: false
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5

cinemind:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
